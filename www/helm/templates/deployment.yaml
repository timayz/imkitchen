apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "www.fullname" . }}
  labels:
    {{- include "www.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # A new pod serves before an old one goes: none is missed, with one pod
  # too.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "www.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "www.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Creates the pod's store and applies its migrations: `serve`
        # refuses to start without it.
        - name: migrate
          image: {{ include "www.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate", "--config", "/etc/imkitchen/config.toml"]
          securityContext:
            {{- include "www.containerSecurityContext" . | nindent 12 }}
          {{- with include "www.env" . }}
          env:
            {{- . | nindent 12 }}
          {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "www.envSecret" . }}
          volumeMounts:
            {{- include "www.volumeMounts" . | nindent 12 }}
      containers:
        - name: www
          image: {{ include "www.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve", "--config", "/etc/imkitchen/config.toml"]
          securityContext:
            {{- include "www.containerSecurityContext" . | nindent 12 }}
          {{- with include "www.env" . }}
          env:
            {{- . | nindent 12 }}
          {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "www.envSecret" . }}
          ports:
            - name: http
              containerPort: 3010
          # www answers whether the api does or not: it serves what its
          # store holds, and catches up once the api is there.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            failureThreshold: 3
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- include "www.volumeMounts" . | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "www.fullname" . }}
        # The store: the pod's own, gone with it.
        - name: data
          emptyDir:
            {{- with .Values.store.sizeLimit }}
            sizeLimit: {{ . | quote }}
            {{- else }}
            {}
            {{- end }}
        - name: tmp
          emptyDir: {}
        {{- if .Values.config.api.tls.secretName }}
        - name: api-ca
          secret:
            secretName: {{ .Values.config.api.tls.secretName }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- if .Values.affinity }}
        {{- toYaml .Values.affinity | nindent 8 }}
        {{- else }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "www.selectorLabels" . | nindent 20 }}
        {{- end }}
