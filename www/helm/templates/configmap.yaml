apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "www.fullname" . }}
  labels:
    {{- include "www.labels" . | nindent 4 }}
data:
  config.toml: |
    [server]
    host = "0.0.0.0"
    port = 3010
    url = {{ include "www.url" . | quote }}
    shutdown_timeout_secs = {{ int .Values.config.server.shutdownTimeoutSecs }}

    [database]
    path = "/var/lib/imkitchen/www.db"

    # token comes from the environment.
    [api]
    url = {{ .Values.config.api.url | quote }}
    events = {{ .Values.config.api.events | quote }}
    {{- if .Values.config.api.tls.secretName }}
    tls_ca = "/etc/imkitchen-tls/api/ca.crt"
    {{- if .Values.config.api.tls.serverName }}
    tls_server_name = {{ .Values.config.api.tls.serverName | quote }}
    {{- end }}
    {{- end }}

    [app]
    {{- with .Values.config.app.googlePlay }}
    google_play = {{ . | quote }}
    {{- end }}
    {{- with .Values.config.app.appStore }}
    app_store = {{ . | quote }}
    {{- end }}
    {{- with .Values.config.app.desktop }}
    desktop = {{ . | quote }}
    {{- end }}

    [contact]
    email = {{ .Values.config.contact.email | quote }}

    [monitoring]
    log_level = {{ .Values.config.monitoring.logLevel | quote }}
    log_json = {{ .Values.config.monitoring.logJson }}
    log_target = {{ .Values.config.monitoring.logTarget }}
    log_line_number = {{ .Values.config.monitoring.logLineNumber }}
