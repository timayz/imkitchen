# Les phrases des refus de l'api, par code. Voir en.yml.
_version: 1

errors:
  refused: La demande a été refusée.
  internal: Une erreur est survenue de notre côté. Réessayez dans un instant.
  invalid_request: L'api ne comprend pas cette demande.
  validation_failed: Certains champs ne sont pas valides.
  not_found: Il n'y a rien à cette adresse.
  method_not_allowed: Cette adresse n'accepte pas cette méthode.
  sign_in_required: Connectez-vous pour continuer.
  signed_out: Votre session a pris fin. Reconnectez-vous.
  not_allowed: Vous n'êtes pas autorisé à faire cela.
  invalid_state: Cette demande ne correspond plus au compte. Recommencez.
  too_many_sign_ins: Trop de tentatives de connexion. Réessayez plus tard.
  writes_paused: Le service n'accepte pas de modifications pour le moment. Réessayez dans un instant.
  write_not_taken: La modification n'a pas pu être enregistrée. Réessayez.
  not_registered: Ce compte n'existe pas.
  already_registered: Ce compte existe déjà.
  already_linked: Ce compte est déjà lié à un autre utilisateur.
  session_changed: La session a changé depuis le début de cette étape.
  signed_in: Vous êtes déjà connecté.
  last_method: Le dernier moyen de connexion ne peut pas être retiré.
  too_many_passkeys: Ce compte a trop de clés d'accès.
  invalid_credentials: L'adresse e-mail ou le mot de passe est incorrect.
  invalid_code: Ce code n'est pas le bon.
  code_expired: Ce code a expiré.
  too_many_attempts: Trop de codes erronés. Demandez-en un nouveau.
  code_recently_sent: Un code vient d'être envoyé. Patientez avant d'en demander un autre.
  invalid_email: Cette adresse e-mail n'est pas valide.
  weak_password: Le mot de passe doit contenir entre 8 et 128 caractères.
  wrong_password: Le mot de passe actuel est incorrect.
  invitation_invalid: Cette invitation n'est plus valide.
  invitation_other_address: Cette invitation est destinée à une autre adresse e-mail.
  signup_closed: Les comptes sont créés sur invitation.
  recipe_not_found: Cette recette n'existe pas.
  plat_not_found: Ce plat n'existe pas.
  list_entry_not_found: Ce repas n'est pas dans votre liste.
  list_full: Votre liste est pleine. Retirez un repas avant d'en ajouter un autre.
  nothing_to_generate: Il n'y a encore rien pour générer une liste. Ajoutez d'abord des recettes ou des plats.
  grocery_item_not_found: Cet article n'est pas dans vos courses.
  page_unreachable: Cette page n'a pas pu être lue. Vérifiez son adresse.
  no_recipe_on_page: Aucune recette n'a été trouvée sur cette page.
  unsupported_image: Ce n'est pas une image que l'api accepte. Envoyez un JPEG, un PNG, un WebP ou un GIF.
  image_too_large: Cette image est trop lourde. Elle doit peser 8 Mo au plus.
  image_too_many_pixels: Cette image est trop grande. Elle doit compter 25 mégapixels au plus.

fields:
  invalid: Cette valeur n'est pas valide.
  required: Ce champ est obligatoire.
  length: Ce champ doit contenir entre %{min} et %{max} caractères.
  too_short: Ce champ doit contenir au moins %{min} caractères.
  too_long: Ce champ doit contenir au plus %{max} caractères.
  range: Cette valeur doit être comprise entre %{min} et %{max}.
  too_small: Cette valeur doit être au moins %{min}.
  too_large: Cette valeur doit être au plus %{max}.
  invalid_email: Cette adresse e-mail n'est pas valide.
  weak_password: Le mot de passe doit contenir entre %{min} et %{max} caractères.
  invalid_cursor: Ce n'est pas un endroit de la liste.
  too_many: Il ne peut pas y en avoir plus de %{max}.
  invalid_url: Ce n'est pas l'adresse d'une page web.
  count: Il doit y en avoir entre %{min} et %{max}.
  duplicate: Cet élément est présent plus d'une fois.
  recipe_not_found: Ce n'est pas l'une de vos recettes.
  plat_not_found: Ce n'est pas l'un de vos plats.
  exclusive: Un repas est une recette ou un plat, pas les deux.
