# A three-node cluster on localhost, for `make cluster.node0` … `cluster.node2`.
# Each node says which one it is, where it serves HTTP and where its store is
# through the environment (see the Makefile).

[cluster]
peers = ["127.0.0.1:7000", "127.0.0.1:7001", "127.0.0.1:7002"]

# Where each node takes the pictures the others copy to it. The nodes keep
# them in data/nodeN/images (see the Makefile).
[images]
peers = ["http://127.0.0.1:7100", "http://127.0.0.1:7101", "http://127.0.0.1:7102"]

# The nodes check each other's one-time codes, so they share the secret the
# codes derive from. This one is for the local cluster only.
[auth]
secret = "local-cluster-only-not-a-secret-0000"
