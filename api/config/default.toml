# Full configuration shape. Every key here has a built-in default; a file given
# with `--config` (or IMKITCHEN_API_CONFIG) overrides it, and
# IMKITCHEN_API__<SECTION>__<KEY> environment variables override both
# (e.g. IMKITCHEN_API__SERVER__PORT=3100).

[server]
host = "0.0.0.0"
port = 3000
# How long requests in flight get to finish once Ctrl+C or SIGTERM asked the
# server to stop, in seconds. Past it the process exits anyway.
shutdown_timeout_secs = 30

[database]
# This node's store: one Turso file holding the events, the subscription
# cursors, the cluster journal and the tables the lists are read from.
# `migrate` creates it; `serve` refuses to start without it. The node keeps
# its cluster state in the same directory.
path = "data/imkitchen.db"

# Without this section the node runs alone. With it, the api instances listed
# in `peers` replicate every write between them (evento cluster): each runs
# over a store of its own and a majority of them must be up for a write to go
# through. See `config/cluster.toml` for a local three-node cluster.
#
# [cluster]
# node_id = 0                        # this node's index into `peers`
# peers = ["api-0.api:7000", "api-1.api:7000", "api-2.api:7000"]
# listen = "0.0.0.0:7000"            # required when this node's peer is a name
#
# [cluster.tls]                      # mutual TLS between the nodes
# ca = "/etc/imkitchen/tls/ca.crt"
# cert = "/etc/imkitchen/tls/tls.crt"
# key = "/etc/imkitchen/tls/tls.key"

# Without this section no sidecar is served. With it, www and admin connect
# here to follow the events they build their read models from (evento's
# remote protocol over TCP, not HTTP), each with its own token. A sidecar
# reads the aggregates `imkitchen-aggregates` lists for it and writes
# nothing; one without a token is refused.
#
# [sidecars]
# listen = "0.0.0.0:4000"
# tls_cert = "/etc/imkitchen/sidecars/tls.crt"   # both or neither; without
# tls_key = "/etc/imkitchen/sidecars/tls.key"    # them tokens travel in clear
#
# [sidecars.tokens]                  # 32 characters or more, the same on
# www = "…"                          # every node
# admin = "…"

[auth]
# How long a session lasts once signed in, in seconds (30 days). A session in
# use past half of it is extended for as long again.
session_lifetime_secs = 2592000
# What the one-time codes mailed to prove an address derive from: 32
# characters or more, kept out of the store, the same on every node. Required
# with [cluster]; without it a node alone draws one each time it starts, and
# the codes mailed before a restart stop working.
# secret = "…"
#
# The root account: the administrator nobody registers, signed in with this
# address and password and no mailed code, and the only one who makes
# administrators. `imkitchen-api hash-password` prints the hash of a password.
#
# [auth.root]
# email = "root@example.com"
# password_hash = "$argon2id$…"

[mail]
# The server the one-time codes are mailed through: smtp://host:port (plain),
# smtp://host:587?tls=required (STARTTLS) or smtps://user:password@host:465.
smtp_url = "smtp://localhost:1025"
from = "imkitchen <no-reply@imkitchen.localhost>"

[images]
# Where this node keeps the pictures of the recipes: two WebP files each,
# 400/<id>.webp and 1200/<id>.webp, beside the store. Every node holds its
# own copy of every picture; a node rebuilt on a new machine takes them from
# the others as they are asked for, or all at once from a copy of this
# directory (`rsync`).
dir = "data/images"
# With [cluster], where each node takes the pictures the others copy to it,
# in the order of cluster.peers, this node included: a port of its own that
# serves nothing else, https:// and the nodes' certificates with
# [cluster.tls], http:// without. `listen` is required when this node's
# entry is a name.
#
# peers = ["https://api-0.api:7100", "https://api-1.api:7100", "https://api-2.api:7100"]
# listen = "0.0.0.0:7100"

[monitoring]
# A `tracing_subscriber::EnvFilter` directive, e.g. "info,tower_http=debug".
log_level = "info"
log_json = false
log_target = true
log_line_number = true
