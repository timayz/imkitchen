{{- if not .Values.existingSecret }}
{{- if and (include "api.clustered" .) (not (index .Values.secretEnv "IMKITCHEN_API__AUTH__SECRET")) }}
{{- fail "secretEnv.IMKITCHEN_API__AUTH__SECRET is required with more than one node (or existingSecret): every node derives the mailed codes from it" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "api.envSecret" . }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $name, $value := .Values.secretEnv }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
{{- end }}
