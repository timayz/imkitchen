{{- $clustered := include "api.clustered" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "api.fullname" . }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "api.nodes" . }}
  replicas: {{ .Values.replicaCount }}
  # All at once: a node is ready once a majority confirmed it, so the first
  # one would wait for the others for ever.
  podManagementPolicy: Parallel
  # One at a time, each ready again before the next: the others keep
  # serving.
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "api.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Creates the node's store if needed and applies its pending
        # migrations: `serve` refuses to start without it.
        - name: migrate
          image: {{ include "api.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate", "--config", "/etc/imkitchen/config.toml"]
          securityContext:
            {{- include "api.containerSecurityContext" . | nindent 12 }}
          {{- with include "api.env" . }}
          env:
            {{- . | nindent 12 }}
          {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "api.envSecret" . }}
          volumeMounts:
            {{- include "api.volumeMounts" . | nindent 12 }}
      containers:
        - name: api
          image: {{ include "api.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve", "--config", "/etc/imkitchen/config.toml"]
          securityContext:
            {{- include "api.containerSecurityContext" . | nindent 12 }}
          {{- with include "api.env" . }}
          env:
            {{- . | nindent 12 }}
          {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "api.envSecret" . }}
          ports:
            - name: http
              containerPort: 3000
            {{- if $clustered }}
            - name: store
              containerPort: {{ .Values.cluster.port }}
            - name: images
              containerPort: {{ .Values.cluster.imagesPort }}
            {{- end }}
            {{- if .Values.sidecars.enabled }}
            - name: sidecars
              containerPort: {{ .Values.sidecars.port }}
            {{- end }}
          # A node that was away copies its store back from a peer before it
          # answers: given ten minutes.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 120
          # Out of the service while it takes no writes: not confirmed by
          # its peers yet, or too far behind them.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            failureThreshold: 3
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- include "api.volumeMounts" . | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "api.fullname" . }}
        - name: tmp
          emptyDir: {}
        {{- if and $clustered .Values.cluster.tls.enabled }}
        - name: nodes-tls
          secret:
            secretName: {{ include "api.nodesTlsSecret" . }}
        {{- end }}
        {{- if and .Values.sidecars.enabled .Values.sidecars.tls.secretName }}
        - name: sidecars-tls
          secret:
            secretName: {{ .Values.sidecars.tls.secretName }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- if .Values.affinity }}
        {{- toYaml .Values.affinity | nindent 8 }}
        {{- else }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "api.selectorLabels" . | nindent 20 }}
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
        {{- with .Values.persistence.labels }}
        labels:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          - ReadWriteOnce
        {{- with .Values.persistence.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
