{{- if not .Values.existingSecret }}
{{- if not (index .Values.secretEnv "IMKITCHEN_APP__API__TOKEN") }}
{{- fail "secretEnv.IMKITCHEN_APP__API__TOKEN is required (or existingSecret): what app opens its connections to the api's events with" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "app.envSecret" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $name, $value := .Values.secretEnv }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
{{- end }}
