# What CI renders the chart with: everything on.
existingSecret: imkitchen-app-env
replicaCount: 3
config:
  api:
    url: "http://api:3000"
    events: "api:4000"
    tls:
      secretName: api-sidecars-ca
      serverName: api
  www:
    url: https://about.example.com
extraEnv:
  IMKITCHEN_APP__MONITORING__LOG_LEVEL: "info,evento=debug"
route:
  enabled: true
  hostname: example.com
  certificate:
    enabled: true
persistence:
  size: 2Gi
  storageClassName: local-path
  labels:
    app.kubernetes.io/part-of: imkitchen
resources:
  requests:
    cpu: 50m
    memory: 64Mi
