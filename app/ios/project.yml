# The Xcode project of the app on iOS, generated by XcodeGen (`make app.ios`
# on a Mac): Xcode compiles nothing itself, it has cargo build the binary and
# wraps it as an app. Signing and the store come with #779.
name: imkitchen
options:
  bundleIdPrefix: app.imkitchen
settings:
  # The build script reads the workspace and writes its target directory.
  ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  imkitchen:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    scheme: {}
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: app.imkitchen.ios
      # The version of the crate, given by the Makefile.
      MARKETING_VERSION: ${APP_VERSION}
      CURRENT_PROJECT_VERSION: 1
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: imkitchen
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The languages of app/lang, and the one the sources are written in.
        CFBundleLocalizations: [en, fr]
        LSRequiresIPhoneOS: true
        UIDeviceFamily: [1, 2]
        UILaunchScreen:
          UIImageRespectsSafeAreaInsets: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Animations at the refresh rate of the screen, not held at 60.
        CADisableMinimumFrameDurationOnPhone: true
        # The scene lifecycle of UIKit, which iOS 27 requires. The delegate
        # is the one of Slint's backend: it puts the window in the scene.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Slint
                UISceneDelegateClassName: SlintWindowSceneDelegate
    sources: []
    postCompileScripts:
      - name: Build with cargo
        script: ./cargo-build.sh
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
