[package]
name = "imkitchen-app"
version = "1.13.0"
edition.workspace = true
authors.workspace = true

# The whole app is the library: the binary of the desktops and of iOS calls
# it, and Android loads it as a shared library from its NativeActivity.
[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
slint = { workspace = true, features = ["std", "accessibility", "compat-1-2"] }

# A window of the desktop, drawn with OpenGL.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
slint = { workspace = true, features = ["backend-winit", "renderer-femtovg"] }

# The fonts of a Linux desktop come from fontconfig, which Slint links unless
# this feature of its own crates is on: loaded when the app starts instead,
# building the workspace asks no header of the machine.
[target.'cfg(target_os = "linux")'.dependencies]
i-slint-common = { workspace = true, features = ["fontconfig-dlopen"] }

# The activity of Android.
[target.'cfg(target_os = "android")'.dependencies]
slint = { workspace = true, features = ["backend-android-activity-06"] }

# A window of UIKit, drawn with Skia on Metal: the one renderer Slint has on
# iOS.
[target.'cfg(target_os = "ios")'.dependencies]
slint = { workspace = true, features = ["backend-winit", "renderer-skia"] }

[build-dependencies]
slint-build.workspace = true

[dev-dependencies]
# A backend without a window, for the tests.
i-slint-backend-testing.workspace = true

# The Android package, as cargo-apk2 builds it (`make app.android`).
[package.metadata.android]
package = "app.imkitchen.android"
apk_name = "imkitchen"
# A phone, and the emulator of a desktop.
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]
# Slint's Skia is C++.
include_cplusplus_shared = true

# Slint's backend needs Android 8.
[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 37

[package.metadata.android.application]
label = "imkitchen"
# No title bar above the window: the app draws all of it.
theme = "@android:style/Theme.DeviceDefault.NoActionBar"

# The one activity Slint's backend runs in. It loads the library, and tells
# the app of a rotation or a keyboard instead of starting over.
[[package.metadata.android.application.activity]]
name = "android.app.NativeActivity"
config_changes = "orientation|screenSize|screenLayout|keyboardHidden"
window_soft_input_mode = "adjustResize"

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "imkitchen_app"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

[package.metadata.cargo-machete]
# Named for the feature it turns on.
ignored = ["i-slint-common"]
