[package]
name = "imkitchen-app"
version = "1.13.0"
edition.workspace = true
authors.workspace = true

[dependencies]
tokio.workspace = true
serde.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
config.workspace = true
topcoat = { workspace = true, features = ["anyhow", "asset", "compression", "cookie", "discover", "l10n-fluent", "metadata", "multipart", "router", "serve", "tailwind", "view"] }
# The store of the read models, and the client of the api's listener.
evento = { workspace = true, features = ["turso", "remote"] }
imkitchen-aggregates.workspace = true
timada-core.workspace = true
tokio-rustls.workspace = true
# The client of the api, for who signs in and what they do.
reqwest = { workspace = true, features = ["json"] }

[build-dependencies]
topcoat = { workspace = true, features = ["tailwind"] }

[dev-dependencies]
# The listener app follows, as the api serves it.
imkitchen-api = { path = "../api" }
tempfile.workspace = true
# The pictures a user gives a recipe, and what a site serves the api.
image.workspace = true
bytes.workspace = true
async-trait.workspace = true
serde_json.workspace = true
# The mails the api sends its codes in, read by the tests.
timada-identity.workspace = true
