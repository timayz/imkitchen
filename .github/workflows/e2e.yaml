name: E2E

# Playwright end-to-end tests against a freshly built server on a throwaway
# SQLite database, with MailDev receiving the outgoing mail (password reset).
# Reports and failure artifacts (screenshots, videos, traces) are uploaded.

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with the Playwright in the nix dev shell (`playwright --version`).
  PLAYWRIGHT_VERSION: 1.63.0

jobs:
  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      maildev:
        image: maildev/maildev:2.2.1
        ports:
          - 1025:1025
          - 1080:1080
    env:
      CI: true
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      IMKITCHEN_BIN: ./target/debug/imkitchen
      E2E_DATABASE_URL: sqlite:${{ github.workspace }}/e2e.db?mode=rwc
      MAILDEV_URL: http://localhost:1080
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the server
        run: cargo build --bin imkitchen

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Playwright is not a package.json dependency on purpose: the nix shell
      # provides it locally, so CI installs the matching version itself.
      - run: npm install --no-save "@playwright/test@${PLAYWRIGHT_VERSION}"
      - run: npx playwright install --with-deps chromium

      - name: Run the e2e tests
        run: npx playwright test

      - name: Upload the HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Upload failure traces, screenshots and videos
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
