name: Publish

# A version tag builds the images of the api and of www and pushes them, as
# timayz/imkitchen:api-<version> and :www-<version>: every application has
# its own tags in the one repository. Run by hand, on any branch, it builds
# the images and pushes nothing: to try a build before a release.
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "**/Cargo.toml"
      - "Cargo.lock"
    tags:
      - "*"

jobs:
  api:
    uses: timayz/.github/.github/workflows/docker.yml@v3
    with:
      image: timayz/imkitchen
      tag-prefix: api-
      file: api/Dockerfile
      push: ${{ startsWith(github.ref, 'refs/tags/v') }}
    secrets:
      DOCKER_REGISTRY_USER: ${{ secrets.DOCKER_REGISTRY_USER }}
      DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

  www:
    uses: timayz/.github/.github/workflows/docker.yml@v3
    with:
      image: timayz/imkitchen
      tag-prefix: www-
      file: www/Dockerfile
      push: ${{ startsWith(github.ref, 'refs/tags/v') }}
    secrets:
      DOCKER_REGISTRY_USER: ${{ secrets.DOCKER_REGISTRY_USER }}
      DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
