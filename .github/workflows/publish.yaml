name: Publish

# A version tag builds the image of the api and pushes it. Run by hand, on
# any branch, it builds the image and pushes nothing: to try a build before
# a release.
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "**/Cargo.toml"
      - "Cargo.lock"
    tags:
      - "*"

jobs:
  api:
    uses: timayz/.github/.github/workflows/docker.yml@v3
    with:
      image: timayz/imkitchen-api
      file: api/Dockerfile
      push: ${{ startsWith(github.ref, 'refs/tags/v') }}
    secrets:
      DOCKER_REGISTRY_USER: ${{ secrets.DOCKER_REGISTRY_USER }}
      DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
