name: Api image

on:
  workflow_call:
    inputs:
      push:
        description: Push the image to the registry once it is built
        default: false
        required: false
        type: boolean
      cache:
        description: Keep the layers of this build in the registry for the next ones
        default: false
        required: false
        type: boolean
    secrets:
      DOCKER_REGISTRY_USER:
        required: false
      DOCKER_REGISTRY_PASSWORD:
        required: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: timayz/imkitchen-api
          labels: |
            org.opencontainers.image.title=imkitchen api
            org.opencontainers.image.licenses=AGPL-3.0
            org.opencontainers.image.vendor=Timada
          tags: |
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - if: ${{ inputs.push || inputs.cache }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      # The dependencies are a layer of their own (cargo-chef): a change to
      # the code builds the api alone. The layers are kept in the registry,
      # under a tag of their own, not in the cache of the repository: that
      # one is the tests', and they fill it.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: api/Dockerfile
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=timayz/imkitchen-api:buildcache
          cache-to: ${{ inputs.cache && 'type=registry,ref=timayz/imkitchen-api:buildcache,mode=max' || '' }}
