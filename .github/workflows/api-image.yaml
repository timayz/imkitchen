name: Api image

on:
  workflow_call:
    inputs:
      push:
        description: Push the image to the registry once it is built
        default: false
        required: false
        type: boolean
      cache:
        description: Keep the dependencies this build compiled for the next ones
        default: false
        required: false
        type: boolean
    secrets:
      DOCKER_REGISTRY_USER:
        required: false
      DOCKER_REGISTRY_PASSWORD:
        required: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: timayz/imkitchen-api
          labels: |
            org.opencontainers.image.title=imkitchen api
            org.opencontainers.image.licenses=AGPL-3.0
            org.opencontainers.image.vendor=Timada
          tags: |
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - if: ${{ inputs.push }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      # The dependencies are a stage of their own (cargo-chef), and the only
      # one that is kept: it changes with Cargo.lock, where a layer of the
      # build after it would be another few hundred megabytes of cache at
      # every push.
      - if: ${{ inputs.cache }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: api/Dockerfile
          target: deps
          cache-from: type=gha,scope=api-image
          cache-to: type=gha,scope=api-image,mode=max

      # From the dependencies this job just built, or from those a branch
      # kept: a pull request reads the cache of the branch it targets.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: api/Dockerfile
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api-image
