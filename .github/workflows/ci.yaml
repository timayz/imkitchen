name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - alpha
      - beta
    paths-ignore:
      - "**/Cargo.toml"
      - "Cargo.lock"

jobs:
  test:
    uses: timayz/.github/.github/workflows/rust-test.yml@v3
    with:
      # The Makefile cuts the api's integration tests into the shards.
      tests: '["make test.api.unit test.api.0", "make test.api.1", "make test.api.2", "make test.www", "make test.admin", "make test.app"]'

  # The charts render: the api's for a cluster and for a node alone, www's,
  # admin's and app's with the least a release needs and with everything on.
  charts:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        app: [api, www, admin, app]
    steps:
      - uses: actions/checkout@v7
      - run: |
          for values in ${{ matrix.app }}/helm/ci/*-values.yaml; do
            helm lint --strict ${{ matrix.app }}/helm -f "$values"
            helm template imkitchen ${{ matrix.app }}/helm -f "$values" > /dev/null
          done
