name: Builder

# The images the release builds of the api, of www, of admin and of app start
# from (timayz/imkitchen:api-builder, :www-builder, :admin-builder,
# :app-builder): the toolchain and a build of the application, so a release
# only compiles what changed since. Built again when the dependencies move on a release branch,
# the commit of a release aside, or by hand.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - alpha
      - beta
      - rc
    paths:
      - "Cargo.lock"
      - "api/builder.Dockerfile"
      - "www/builder.Dockerfile"
      - "admin/builder.Dockerfile"
      - "app/builder.Dockerfile"

jobs:
  build:
    # Not for the commit of a release: it only moves the dependencies
    # (`cargo update`), and the release that follows it builds from the
    # image as it stands.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release)') }}
    strategy:
      fail-fast: false
      matrix:
        app: [api, www, admin, app]
    # One tag an application for every branch: the last build is the one
    # that stays, and a build a newer one overtakes is not worth finishing.
    concurrency:
      group: builder-${{ matrix.app }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: timayz/imkitchen
          labels: |
            org.opencontainers.image.vendor=Timada
          tags: |
            type=raw,value=${{ matrix.app }}-builder

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - uses: docker/build-push-action@v7
        with:
          file: "${{ matrix.app }}/builder.Dockerfile"
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
