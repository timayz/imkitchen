{{- if not .Values.existingSecret }}
{{- if not (index .Values.secretEnv "IMKITCHEN_ADMIN__API__TOKEN") }}
{{- fail "secretEnv.IMKITCHEN_ADMIN__API__TOKEN is required (or existingSecret): what admin opens its connections to the api's events with" }}
{{- end }}
{{- if not (index .Values.secretEnv "IMKITCHEN_ADMIN__SESSION__KEY") }}
{{- fail "secretEnv.IMKITCHEN_ADMIN__SESSION__KEY is required (or existingSecret): what the cookie of a session is encrypted under, kept from one start to the next" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "admin.envSecret" . }}
  labels:
    {{- include "admin.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $name, $value := .Values.secretEnv }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
{{- end }}
