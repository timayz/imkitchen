[workspace]
members = [
	"api",
	"aggregates",
	"www",
	"admin",
	"app",
]
resolver = "3"

[workspace.package]
edition = "2024"
authors = ["imkitchen team"]

[workspace.dependencies]
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
axum = "0.8"
tower-http = { version = "0.7", features = ["trace"] }
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4.6", features = ["derive", "env"] }
config = { version = "0.15", default-features = false, features = ["toml"] }
# Each crate turns on the features it needs: the api its store, its cluster
# and the listener of the sidecars, the aggregates crate none.
evento = "2.0.0-alpha.43"
# The aggregates the api writes and the sidecars follow.
imkitchen-aggregates = { path = "aggregates" }
bitcode = "0.6"
tempfile = "3.27"
# Identity: users, their sign-in methods and their sessions, event-sourced.
# Not on crates.io: pinned to a commit of the repository, both from the same
# one so they share `timada-core`.
timada-identity = { git = "https://github.com/timayz/timada", rev = "f4d99e82684ae038aea40022db9caaf4b45358c6" }
timada-core = { git = "https://github.com/timayz/timada", rev = "f4d99e82684ae038aea40022db9caaf4b45358c6" }
serde_json = "1.0"
# The session tokens: random bytes, handed out as base64, kept as their hash.
rand = "0.10"
sha2 = "0.11"
base64 = "0.23"
# Mails the one-time codes.
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1", "tokio1-rustls-tls", "pool"] }
async-trait = "0.1"
# The worker ids of the executor the sidecars are served.
ulid = "3.0"
# TLS on the listener of the sidecars.
tokio-rustls = "0.26"
# The certificate of the tests' listener.
rcgen = "0.14"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# What a command's body must hold, said field by field.
validator = { version = "0.21", features = ["derive"] }
# The refusals' sentences, in each language the api speaks (api/locales).
rust-i18n = "4.2"
# The OpenAPI document, generated from the handlers the router serves, and
# the page that shows it.
utoipa = "6.0"
utoipa-axum = "0.3"
utoipa-scalar = "0.4"
# Importing a recipe: the page is fetched, decoded as its server says it is
# written, and read as HTML. html5ever is the parser scraper is built on,
# named to feed it a page piece by piece: its version follows scraper's.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
encoding_rs = "0.8"
scraper = { version = "0.29", default-features = false }
html5ever = "0.40"

[profile.release]
codegen-units = 1
panic = "abort"
lto = true
strip = true

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package.'*']
opt-level = 3
debug = false

[profile.debugging]
inherits = "dev"
debug = true
