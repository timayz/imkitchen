[workspace]
members = [
	"api",
	"www",
	"admin",
	"app",
]
resolver = "3"

[workspace.package]
edition = "2024"
authors = ["imkitchen team"]

[workspace.dependencies]
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
axum = "0.8"
tower-http = { version = "0.7", features = ["trace"] }
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4.6", features = ["derive", "env"] }
config = { version = "0.15", default-features = false, features = ["toml"] }
evento = { version = "2.0.0-alpha.43", features = ["turso", "cluster"] }
bitcode = "0.6"
tempfile = "3.27"

[profile.release]
codegen-units = 1
panic = "abort"
lto = true
strip = true

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package.'*']
opt-level = 3
debug = false

[profile.debugging]
inherits = "dev"
debug = true
