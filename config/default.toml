[server]
url = "https://imkitchen.localhost"
host = "0.0.0.0"
port = 3000

[root]
email = "root@imkitchen.localhost"
password = "imkitchen"

[database]
url = "sqlite:imkitchen.db"
max_connections = 5

[jwt]
audience = "https://imkitchen.localhost"
issuer = "imkitchen.localhost"
secret = "TOKEN-NOT-SECURE-MUST-BE-CHANGE"
expiration_days = 14

# Monetization (premium subscriptions + ad-supported tier).
# Remove or comment out this whole section to disable it: every user then
# gets full access, and all premium/ads UI (pricing, upgrade CTAs, billing
# plans, ad slots) is hidden.
[premium]
monthly_price = 499
annual_rate = 20
tax = true

# Google Analytics / Tag Manager. Remove or comment out this section to
# disable it entirely. When present, the tag loads with Consent Mode v2
# defaults set to "denied"; consent is granted only while the user's
# ad_consent cookie is present. Never emitted in demo mode. The id decides
# what loads: a GA4 measurement id ("G-XXXXXXXXXX") loads gtag.js directly,
# a Tag Manager container id ("GTM-XXXXXXXX") loads gtm.js.
# [analytics]
# google_tag_id = "G-XXXXXXXXXX"

# First-party audience measurement (landing-page visits: device, browser,
# country, time). Uses a dedicated SQLite database, separate from [database],
# so beacon writes never touch the main application database. Omit this
# section to disable the feature entirely.
# [audience]
# database_url = "sqlite:audience.db"

# The native app shell (Android TWA). Remove or comment out this whole
# section to disable it: /.well-known/assetlinks.json 404s, `is_native_app` is
# always false, and nothing about the web app changes.
#
# `host` is a dedicated hostname so the app is identifiable per request. A TWA
# runs inside Chrome and shares its cookie jar, so a persisted "this is the
# app" marker would also hide billing when the same person opens the website in
# their browser; a separate host makes that impossible rather than merely
# unlikely.
#
# Both signing fingerprints belong in the list: Play App Signing re-signs the
# bundle, so a locally installed build and the Play build present different
# certificates. Listing only one leaves the store build showing a URL bar.
# [native_app]
# host = "app.imkitchen.app"
# package_name = "app.imkitchen.android"
# sha256_cert_fingerprints = []

[monitoring]
log_level = "debug,sqlx=info,tower_http=info"
log_json = false
log_target = true
log_line_number = true

[stripe]
secret_key = ""
publishable_key = ""

[email]
smtp_host = "localhost"
smtp_port = "1025"
smtp_username = ""
smtp_password = ""
from_address = "no-reply@imkitchen.localhost"
contact_address = "contact@imkitchen.localhost"
