[server]
url = "https://imkitchen.localhost"
host = "0.0.0.0"
port = 3000

[root]
email = "root@imkitchen.localhost"
password = "imkitchen"

[database]
url = "sqlite:imkitchen.db"
max_connections = 5

[jwt]
audience = "https://imkitchen.localhost"
issuer = "imkitchen.localhost"
secret = "TOKEN-NOT-SECURE-MUST-BE-CHANGE"
expiration_days = 14

# Monetization (premium subscriptions + ad-supported tier).
# Remove or comment out this whole section to disable it: every user then
# gets full access, and all premium/ads UI (pricing, upgrade CTAs, billing
# plans, ad slots) is hidden.
[premium]
monthly_price = 499
annual_rate = 20
tax = true

# Google Tag Manager. Remove or comment out this section to disable it
# entirely. When present, gtm.js loads with Consent Mode v2 defaults set to
# "denied"; consent is granted only while the user's ad_consent cookie is
# present. Never emitted in demo mode.
# [analytics]
# google_tag_manager_id = "GTM-XXXXXXXX"

[monitoring]
log_level = "debug,sqlx=info,tower_http=info"
log_json = false
log_target = true
log_line_number = true

[stripe]
secret_key = ""
publishable_key = ""

[email]
smtp_host = "localhost"
smtp_port = "1025"
smtp_username = ""
smtp_password = ""
from_address = "no-reply@imkitchen.localhost"
contact_address = "contact@imkitchen.localhost"
