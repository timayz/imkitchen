# XcodeGen project definition — run `xcodegen generate` in this directory
# (brew install xcodegen) to produce imkitchen.xcodeproj. Regenerate after
# changing this file; the .xcodeproj itself is not committed.
name: imkitchen
options:
  deploymentTarget:
    iOS: "15.0"
targets:
  imkitchen:
    type: application
    platform: iOS
    sources:
      - imkitchen
    info:
      path: imkitchen/Info.plist
      properties:
        CFBundleDisplayName: imkitchen
        CFBundleShortVersionString: 1.0.0
        CFBundleVersion: "1"
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.imkitchen
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
