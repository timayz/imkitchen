<!-- Follow Button -->
<button id="follow-btn" ts-swap-push="#follow-btn" ts-req="/cooks/{{ username }}/{% if following %}un{% endif %}follow"
  ts-req-method="post"
  class="shrink-0 inline-flex items-center gap-1.5 px-3.5 py-2 rounded-full text-xs font-semibold transition
    {% if following %}bg-cream-2 text-ink hover:bg-cream{% else %}bg-primary-500 text-white hover:bg-primary-600{% endif %}">
  {% if following %}
  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
  </svg>
  {{ "Following"|t }}
  {% else %}
  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" d="M12 5v14m-7-7h14"/>
  </svg>
  {{ "Follow"|t }}
  {% endif %}
</button>
